# Builds Signal / Noise for Linux and Windows.
#
#   push / pull request      check the core (tests, every level's reference and anti-solutions,
#                            the story ledger), then build the installers
#   release published        the same, then attach the installers to that release
#                            (Releases → Draft a new release → tag v0.1.0 → Publish release)
#   Actions → Run workflow   build on demand
#
# The installers appear under the run's "Artifacts" (and on the release page for releases):
#   Linux    .deb and .AppImage
#   Windows  NSIS setup .exe (installs for the current user, no admin rights)

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core, levels and story
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the bundled compiler (zig)
        run: python3 toolchain/fetch-zig.py --platform linux-x86_64 --out app/src-tauri/resources/zig

      - name: Unit tests
        run: cargo test --release --workspace

      - name: Every level — references pass, anti-solutions fail for the right reason
        run: |
          cargo build --release -p k28-cli
          ./target/release/k28 ci

      - name: Story ledger
        run: node tools/ledger-cli.js content/story 60

  bundle:
    name: Installer (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            zig: linux-x86_64
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            zig: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      # Git on Windows turns LF into CRLF on checkout unless told otherwise. The story is hashed
      # byte for byte (saves depend on it), so every platform must build from the same bytes,
      # whatever .gitattributes ended up in the repository.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch the bundled compiler (zig)
        run: python toolchain/fetch-zig.py --platform ${{ matrix.zig }} --out app/src-tauri/resources/zig

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Build the game
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          find app/src-tauri/target/release/bundle \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \) \
            -exec cp {} dist-installers/ \;
          ls -la dist-installers

      - uses: actions/upload-artifact@v4
        with:
          name: signal-noise-${{ matrix.zig }}
          path: dist-installers/*
          if-no-files-found: error

  release:
    name: Attach installers to the release
    if: github.event_name == 'release'
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: installers/*
